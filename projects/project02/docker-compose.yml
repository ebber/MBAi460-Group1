# Project 02 local dev topology.
#
# Two lanes (selected via Compose profiles):
#
#   AWS lane (default)           — server only; talks to real AWS RDS + S3 + Rekognition
#     `docker compose up server -d --build`
#     or:  make docker-up-aws
#
#   LocalStack lane              — server + mysql + localstack on one bridge network
#     `docker compose --profile localstack up -d --build`
#     or:  make docker-up-localstack
#
# Service-to-lane mapping:
#   server     — both lanes (no profile = always runs)
#   mysql      — LocalStack lane only (profiles: ["localstack"])
#   localstack — LocalStack lane only (profiles: ["localstack"])
#
# Config files (both gitignored except .example):
#   client/photoapp-config.ini          — real AWS values; used by AWS lane
#   client/photoapp-config.ini.example  — LocalStack-shaped values; used by LocalStack lane
#
# The Makefile selects which file to mount via PHOTOAPP_CONFIG_FILE; default is
# the real AWS file. AWS_ENDPOINT_URL is set by the LocalStack lane only; the
# AWS lane omits it so the SDK uses real endpoints.

services:

  # ── MySQL 8.4 ──────────────────────────────────── LocalStack lane only ────
  mysql:
    profiles: ["localstack"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: photoapp_root_local
      MYSQL_DATABASE:      photoapp
      MYSQL_USER:          photoapp
      MYSQL_PASSWORD:      photoapp_local
    ports:
      - "3307:3306"   # 3307 on host avoids collision with a locally running MySQL
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "photoapp", "-pphotoapp_local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - photoapp

  # ── LocalStack 3 (S3 + IAM) ──────────────────── LocalStack lane only ────
  localstack:
    profiles: ["localstack"]
    image: localstack/localstack:3
    environment:
      SERVICES:              s3,iam
      AWS_DEFAULT_REGION:    us-east-1
      AWS_ACCESS_KEY_ID:     test
      AWS_SECRET_ACCESS_KEY: test
      # DEBUG=1              # uncomment for LocalStack verbose logs
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - photoapp

  # ── Server (Node.js 24) ────────────────────────────────── both lanes ────
  server:
    build:
      context: ../..          # monorepo root — required for workspace-aware npm ci
      dockerfile: projects/project02/server/Dockerfile
    environment:
      NODE_ENV:             development
      PORT:                 8080
      LOG_LEVEL:            debug
      # AWS endpoint:
      #   - AWS lane:        leave AWS_ENDPOINT_URL unset → SDK uses real AWS
      #   - LocalStack lane: Makefile exports AWS_ENDPOINT_URL=http://localstack:4566
      AWS_ENDPOINT_URL:     ${AWS_ENDPOINT_URL:-}
      AWS_DEFAULT_REGION:   ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID:    ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Config file selector. Defaults to the real-AWS file; LocalStack lane
      # overrides via Makefile to point at photoapp-config.ini.example.
      PHOTOAPP_CONFIG_PATH: /app/projects/project02/client/${PHOTOAPP_CONFIG_FILE:-photoapp-config.ini}
    ports:
      - "8080:8080"
    volumes:
      # Hot-reload: bind-mount source directories over the built image layers.
      - ./server:/app/projects/project02/server
      - ./client:/app/projects/project02/client
    depends_on:
      # `required: false` (Compose v2.20+) lets the AWS lane start the server
      # without these profiled sidecars defined. The LocalStack lane activates
      # the profile and the dependencies become real (wait for health).
      mysql:
        condition: service_healthy
        required: false
      localstack:
        condition: service_healthy
        required: false
    networks:
      - photoapp
    # Override CMD to start with nodemon for hot-reload.
    # Falls back to `node server.js` if nodemon isn't installed.
    command: >
      sh -c "if command -v npx > /dev/null 2>&1; then
               npx --yes nodemon server.js;
             else
               node server.js;
             fi"

  # ── Client (Python 3 — placeholder until Phase 3) ────────────────────────────
  # Dockerfile at client/Dockerfile is provided by the assignment image; it
  # lands in Phase 3. Uncomment once that image is available.
  #
  # client:
  #   build:
  #     context: .
  #     dockerfile: client/Dockerfile
  #   volumes:
  #     - ./client:/app/client
  #   depends_on:
  #     server:
  #       condition: service_started
  #   networks:
  #     - photoapp

volumes:
  mysql_data:
  localstack_data:

networks:
  photoapp:
    driver: bridge

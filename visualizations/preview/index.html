<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MBAi460-Group1 — Project Visualizations</title>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.1/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
  <style>
    :root {
      --bg: #fafafa;
      --fg: #1a1a1a;
      --muted: #666;
      --accent: #0066cc;
      --border: #e0e0e0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--fg);
      line-height: 1.5; height: 100%; overflow: hidden;
    }
    body { display: flex; flex-direction: column; }
    header {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 12px 24px; flex-shrink: 0;
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    header .meta { margin-top: 2px; font-size: 11px; color: var(--muted); }
    .controls {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 10px 24px; flex-shrink: 0;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .control-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted); font-weight: 600;
    }
    .view-select {
      padding: 6px 28px 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: var(--fg);
      min-width: 240px;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23666' d='M0 0l5 6 5-6z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
    }
    .view-select:hover { border-color: var(--accent); }
    .segments {
      display: inline-flex; border: 1px solid var(--border);
      border-radius: 6px; overflow: hidden; background: #fff;
    }
    .segments button {
      padding: 6px 14px; border: 0; background: transparent;
      font-size: 12px; font-weight: 500; cursor: pointer; color: var(--fg);
      border-right: 1px solid var(--border);
    }
    .segments button:last-child { border-right: 0; }
    .segments button:hover { background: #f0f4f8; }
    .segments button.active { background: var(--accent); color: #fff; }
    .btn {
      padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px;
      background: #fff; font-size: 12px; cursor: pointer; color: var(--fg);
    }
    .btn:hover { background: #f0f4f8; }
    .btn-group { display: inline-flex; gap: 6px; }
    .lod-group { display: inline-flex; align-items: center; gap: 8px; }
    .lod-group.hidden { display: none; }
    .legend {
      display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; margin-left: auto;
    }
    .legend-item {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px; border-radius: 3px; border: 1px solid var(--border);
    }
    .swatch {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 2px; border: 1px solid;
    }
    .swatch.active { background: #fff4cc; border-color: #cc9900; }
    .swatch.library { background: #cce5ff; border-color: #0066cc; }
    .swatch.cloud { background: #ffe6cc; border-color: #ff6600; }
    .swatch.coord { background: #e6ffe6; border-color: #00aa00; }
    .swatch.historical { background: #f0f0f0; border-color: #888; }
    .swatch.external { background: #f0e6ff; border-color: #9933cc; }
    .stage {
      flex: 1 1 auto; position: relative; background: #fafafa; overflow: hidden;
    }
    #cy { position: absolute; inset: 0; }
    .status-pill {
      position: absolute; bottom: 12px; right: 12px;
      background: rgba(255,255,255,0.95); border: 1px solid var(--border);
      border-radius: 4px; padding: 4px 10px; font-size: 11px; color: var(--muted);
      pointer-events: none;
    }
    code {
      background: #eef; padding: 1px 5px; border-radius: 3px; font-size: 11px;
    }
    kbd {
      background: #f5f5f5; border: 1px solid var(--border);
      border-radius: 3px; padding: 1px 5px;
      font-family: -apple-system, monospace; font-size: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>MBAi460-Group1 — Project Visualizations</h1>
    <div class="meta">

    </div>

    <div class="lod-group" id="lod-group">
      <span class="control-label">Detail</span>

        <button data-lod="standard" class="active">Standard</button>
        <button data-lod="detailed">Detailed</button>
      </div>
    </div>

    <span class="control-label" style="margin-left: 4px;">Zoom</span>
    <div class="btn-group">

      <button class="btn" id="btn-zoom-out">−</button>

    <span class="control-label" style="margin-left: 4px;">Layout</span>

      <span class="legend-item"><span class="swatch historical"></span> Existing / unchanged</span>
      <span class="legend-item"><span class="swatch external"></span> External (Gradescope)</span>
    </div>
  </div>

    // ============================================================

    let cy = null;
    let currentView = 'project-structure';
    let currentLod = 'standard';
    let pendingRestore = null;
    const STORAGE_KEY = 'mbai460-viz-layouts-v1';
    const statusPill = document.getElementById('status-pill');
    const lodGroup = document.getElementById('lod-group');
    const viewSelect = document.getElementById('view-select');

    function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

    function viewLabel(v) {
      return v === 'project-structure' ? 'Project Structure' : 'P02 Sprint';
    }

    function lodLabel(l) {
      return l === 'default' ? 'Architecture' : capitalize(l);
    }

    function updateStatus() {
      const z = cy ? cy.zoom() : 1;
      statusPill.textContent =
        viewLabel(currentView) + ' · ' + lodLabel(currentLod) +
        ' · zoom ' + z.toFixed(2) + '×';
    }

    function syncControlsForView() {
      // Show LOD segments only when the current view supports >1 LOD level
      const lods = Object.keys(DIAGRAMS[currentView]);
      if (lods.length > 1) {
        lodGroup.classList.remove('hidden');
      } else {
        lodGroup.classList.add('hidden');
      }
      // If current LOD doesn't exist in this view, fall back to first
      if (!DIAGRAMS[currentView][currentLod]) {
        currentLod = lods[0];
      }
      // Update LOD button active state
      document.querySelectorAll('.segments button').forEach((b) => {
        b.classList.toggle('active', b.dataset.lod === currentLod);
      });
    }

    function render() {
      const data = DIAGRAMS[currentView][currentLod];
      if (!data) {
        console.error('No diagram for', currentView, currentLod);
        return;
      }

      if (cy) { cy.destroy(); cy = null; }

      cy = cytoscape({
        container: document.getElementById('cy'),
        elements: { nodes: data.nodes, edges: data.edges },
        style: STYLE,
        layout: {
          name: 'dagre',
          rankDir: 'LR',
          ranker: 'tight-tree',
          nodeSep: 30,
          edgeSep: 12,
          rankSep: 90,
          padding: 24,
          animate: false,
        },
        wheelSensitivity: 0.2,
        minZoom: 0.15,
        maxZoom: 5,
        boxSelectionEnabled: false,
      });

      cy.on('zoom pan', updateStatus);
      cy.on('drag', 'node', updateStatus);
      cy.ready(() => {
        if (pendingRestore) {
          applyPendingRestore();
        } else {
          cy.fit(undefined, 30);
        }
        updateStatus();
      });
    }

    // ============================================================
    // SAVED LAYOUTS (localStorage)
    //
    // A saved layout captures: view, LOD, every leaf node's (x,y),
    // current zoom, and current pan. Compound parents derive from
    // their children so we don't need to save them.
    // ============================================================

    function getSavedLayouts() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
      catch (e) { return {}; }
    }

    function setSavedLayouts(layouts) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(layouts));
    }

    function saveCurrentLayout(name) {
      if (!cy) return false;
      const positions = {};
      cy.nodes().forEach((n) => {
        if (!n.isParent()) {
          const p = n.position();
          positions[n.id()] = { x: p.x, y: p.y };
        }
      });
      const layouts = getSavedLayouts();
      layouts[name] = {
        view: currentView,
        lod: currentLod,
        positions: positions,
        zoom: cy.zoom(),
        pan: cy.pan(),
        savedAt: new Date().toISOString(),
      };
      setSavedLayouts(layouts);
      refreshSavedDropdown(name);
      return true;
    }

    function restoreLayout(name) {
      const layouts = getSavedLayouts();
      const layout = layouts[name];
      if (!layout) return;

      // Switch view + LOD to the saved ones
      currentView = layout.view;
      currentLod = layout.lod;
      document.getElementById('view-select').value = currentView;
      syncControlsForView();

      // Queue the position+zoom+pan restore so render() applies it
      // after dagre lays out the new diagram.
      pendingRestore = layout;
      render();
    }

    function applyPendingRestore() {
      if (!pendingRestore || !cy) return;
      const layout = pendingRestore;
      pendingRestore = null;

      cy.batch(() => {
        Object.entries(layout.positions || {}).forEach(([id, pos]) => {
          const n = cy.getElementById(id);
          if (n && n.length > 0 && !n.isParent()) {
            n.position(pos);
          }
        });
      });

      if (typeof layout.zoom === 'number') cy.zoom(layout.zoom);
      if (layout.pan && typeof layout.pan.x === 'number') cy.pan(layout.pan);
    }

    function deleteLayout(name) {
      const layouts = getSavedLayouts();
      delete layouts[name];
      setSavedLayouts(layouts);
      refreshSavedDropdown();
    }

    function refreshSavedDropdown(selectName) {
      const select = document.getElementById('saved-layouts');
      const layouts = getSavedLayouts();
      const names = Object.keys(layouts).sort();
      select.innerHTML = '';

      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = names.length === 0
        ? '— No saved layouts —'
        : '— Restore saved layout —';
      select.appendChild(placeholder);

      names.forEach((name) => {
        const layout = layouts[name];
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name + '  (' + viewLabel(layout.view) + ' · ' + capitalize(layout.lod) + ')';
        select.appendChild(opt);
      });

      if (selectName && layouts[selectName]) {
        select.value = selectName;
      }
    }

    // ============================================================
    // CONTROL HANDLERS
    // ============================================================

    viewSelect.addEventListener('change', (e) => {
      currentView = e.target.value;
      syncControlsForView();
      render();
    });

    document.querySelectorAll('.segments button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.segments button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentLod = btn.dataset.lod;
        render();
      });
    });

    document.getElementById('btn-zoom-in').addEventListener('click', () => {
      if (!cy) return;
      cy.zoom({ level: cy.zoom() * 1.25, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
    });
    document.getElementById('btn-zoom-out').addEventListener('click', () => {
      if (!cy) return;
      cy.zoom({ level: cy.zoom() / 1.25, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
    });
    document.getElementById('btn-fit').addEventListener('click', () => {
      if (!cy) return;
      cy.fit(undefined, 30);
    });
    document.getElementById('btn-relayout').addEventListener('click', () => {
      if (!cy) return;
      cy.layout({
        name: 'dagre', rankDir: 'LR', ranker: 'tight-tree',
        nodeSep: 30, edgeSep: 12, rankSep: 90, padding: 24, animate: true, animationDuration: 400
      }).run();
    });

    // Saved-layout handlers
    document.getElementById('btn-save-layout').addEventListener('click', () => {
      const suggested = (currentView === 'p02-sprint' ? 'sprint' : 'structure') + '-' + currentLod;
      const name = prompt('Save current layout as:', suggested);
      if (!name) return;
      const trimmed = name.trim();
      if (!trimmed) return;
      const existing = getSavedLayouts()[trimmed];
      if (existing && !confirm('Overwrite existing layout "' + trimmed + '"?')) return;
      saveCurrentLayout(trimmed);
    });

    document.getElementById('saved-layouts').addEventListener('change', (e) => {
      const name = e.target.value;
      if (name) restoreLayout(name);
    });

    document.getElementById('btn-delete-layout').addEventListener('click', () => {
      const select = document.getElementById('saved-layouts');
      const name = select.value;
      if (!name) {
        alert('Pick a saved layout from the dropdown first.');
        return;
      }
      if (confirm('Delete saved layout "' + name + '"?')) {
        deleteLayout(name);
      }
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
      if (!cy) return;
      switch (e.key) {
        case '+': case '=':
          cy.zoom({ level: cy.zoom() * 1.2, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
          break;
        case '-': case '_':
          cy.zoom({ level: cy.zoom() / 1.2, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
          break;
        case '0': cy.fit(undefined, 30); break;
        case '1':
          if (DIAGRAMS[currentView]['overview']) {
            currentLod = 'overview';
            syncControlsForView();
            render();
          }
          break;
        case '2':
          if (DIAGRAMS[currentView]['standard']) {
            currentLod = 'standard';
            syncControlsForView();
            render();
          }
          break;
        case '3':
          if (DIAGRAMS[currentView]['detailed']) {
            currentLod = 'detailed';
            syncControlsForView();
            render();
          }
          break;
      }
    });

    // Initial render
    syncControlsForView();
    refreshSavedDropdown();
    render();
  </script>
</body>
</html>
